name: Validate Transaction Table and Native App

on:
  push:
    branches:
      - feature-transaction-table-tauri-app-20260923

concurrency:
  group: validate-transaction-tauri
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build web frontend
        working-directory: frontend
        run: npm run build

      - name: Check Tauri configuration
        working-directory: frontend
        run: npm run tauri info

      - name: Generate Tauri icons
        working-directory: frontend
        run: npm run app:icons

      - name: Compile Tauri desktop shell
        working-directory: frontend
        run: npm run tauri build -- --no-bundle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest -q backend/tests

      - name: Compile backend
        run: python -m compileall -q backend/app
